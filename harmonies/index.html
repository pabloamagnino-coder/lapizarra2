<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmonies 3D (prototipo)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <header id="topbar">
      <div class="brand">Harmonies <b>3D</b> <small>prototipo</small></div>
      <div id="players"></div>
      <div class="tools">
        <button id="btn-rules" class="ghost" title="Reglas">📖 Reglas</button>
        <button id="btn-ambient" class="ghost" title="Sonido ambiente">🌿</button>
        <button id="btn-sound" class="ghost" title="Sonido">🔊</button>
      </div>
    </header>

    <aside id="river-panel" class="panel">
      <h3>Animales disponibles</h3>
      <div id="river"></div>
    </aside>

    <aside id="side-panel" class="panel">
      <div id="status"></div>
      <div id="tray"></div>
      <div class="actions">
        <button id="btn-discard" class="ghost hidden">Descartar ficha</button>
        <button id="btn-end" class="primary" disabled>Terminar turno ⏎</button>
      </div>
      <div id="score"></div>
    </aside>

    <footer id="hand-panel" class="panel">
      <h3>Tus animales <small id="hand-count"></small></h3>
      <div id="hand"></div>
    </footer>

    <div id="toast"></div>
    <div id="modal" class="hidden"><div class="modal-box" id="modal-box"></div></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
